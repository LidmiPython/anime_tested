<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Web Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; }
        .player-container { width: 100vw; height: 56.25vw; max-height: 70vh; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .controls { padding: 15px; }
        select, button { padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="player-container">
        <iframe id="anime-iframe" src="" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <label>Озвучка:</label>
        <select id="dubbing-select" onchange="changeDubbing()"></select>

        <label>Серия:</label>
        <select id="episode-select" onchange="changeEpisode()"></select>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем Mini App на весь экран

        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('anime_id');

        let videosData = [];

        async function loadAnimeVideos() {
            const resp = await fetch(`https://old.yummyani.me/api/anime/${animeId}?need_videos=true`);
            const json = await resp.json();
            videosData = json.response.videos || [];
            
            initPlayer();
        }

        function initPlayer() {
            if (!videosData.length) return;
            
            // Заполняем список серий и озвучек
            const iframe = document.getElementById('anime-iframe');
            // Указываем https: перед //kodikplayer.com/
            let firstIframe = videosData[0].iframe_url;
            if (firstIframe.startsWith('//')) firstIframe = 'https:' + firstIframe;
            
            iframe.src = firstIframe;
        }

        loadAnimeVideos();
    </script>
</body>
</html>
