<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Player</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #08090e;
            --apple-glass: rgba(20, 24, 38, 0.65);
            --apple-glass-hover: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.09);
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --purple-gradient: linear-gradient(135deg, #7f00ff 0%, #e100ff 100%);
            --text-main: #f5f5f7;
            --text-sub: #94a3b8;
            --glow-cyan: 0 0 25px rgba(0, 242, 254, 0.45);
            --glow-purple: 0 0 25px rgba(225, 0, 255, 0.45);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", 'Outfit', sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* 🌌 Анимированный неоновый фон с плавающими орбами */
        .bg-orbs-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: floatOrb 18s ease-in-out infinite alternate;
            will-change: transform;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: #00f2fe;
            top: -80px;
            left: -100px;
            animation-duration: 16s;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: #7f00ff;
            bottom: -100px;
            right: -120px;
            animation-duration: 22s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #e100ff;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(60px, 40px) scale(1.15) rotate(180deg); }
            100% { transform: translate(-40px, 80px) scale(0.9) rotate(360deg); }
        }

        /* Главный контейнер */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 16px 16px 40px 16px;
        }

        /* Видеоплеер Apple TV */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 480px;
            background: #000;
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.1);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .content-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Hero Карточка Аниме с парящим эффектом */
        .hero-card {
            display: flex;
            gap: 16px;
            background: var(--apple-glass);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .hero-card:hover {
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 242, 254, 0.15);
        }

        .poster-img {
            width: 72px;
            height: 100px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hero-card:hover .poster-img {
            transform: scale(1.05) rotate(-2deg);
        }

        .hero-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        .anime-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
        }

        .badge-status { 
            background: rgba(0, 242, 254, 0.12); 
            color: var(--accent-primary); 
            border-color: rgba(0, 242, 254, 0.3); 
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Перенос кнопок в сетку + пружинистый ховер */
        .pills-scroll-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .pill-btn {
            padding: 10px 20px;
            background: var(--apple-glass);
            border: 1px solid var(--card-border);
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: relative;
            overflow: hidden;
        }

        .pill-btn:hover {
            background: var(--apple-glass-hover);
            color: #fff;
            transform: translateY(-2px) scale(1.03);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .pill-btn:active {
            transform: translateY(0) scale(0.96);
        }

        /* 💫 Дышащая неоновая пульсация активной кнопки */
        .pill-btn.active {
            background: var(--accent-gradient);
            color: #000;
            border-color: transparent;
            font-weight: 700;
            animation: pulseCyan 2.5s ease-in-out infinite;
        }

        .player-pill.active {
            background: var(--purple-gradient);
            color: #fff;
            animation: pulsePurple 2.5s ease-in-out infinite;
        }

        @keyframes pulseCyan {
            0%, 100% { box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4); }
            50% { box-shadow: 0 6px 28px rgba(0, 242, 254, 0.75); }
        }

        @keyframes pulsePurple {
            0%, 100% { box-shadow: 0 4px 15px rgba(225, 0, 255, 0.4); }
            50% { box-shadow: 0 6px 28px rgba(225, 0, 255, 0.75); }
        }

        /* Поле поиска серий */
        .ep-search-input {
            width: 100px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .ep-search-input:focus { 
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        /* Сетка серий */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
        }

        .ep-card {
            padding: 13px 0;
            background: var(--apple-glass);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .ep-card:hover {
            background: var(--apple-glass-hover);
            color: #fff;
            transform: translateY(-2px) scale(1.05);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .ep-card:active { 
            transform: scale(0.92); 
        }

        .ep-card.active {
            background: var(--accent-gradient);
            color: #000;
            border-color: transparent;
            animation: pulseCyan 2.5s ease-in-out infinite;
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #08090e;
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 14px;
            z-index: 10;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(0, 242, 254, 0.15);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- 🌌 Анимированный плазменный фон -->
    <div class="bg-orbs-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-container">
        <!-- Плеер Apple TV -->
        <div class="player-wrapper">
            <div id="loader" class="loading-screen">
                <div class="spinner"></div>
                <div>Загрузка видео...</div>
            </div>
            <iframe id="anime-iframe" src="" allow="fullscreen; autoplay" allowfullscreen style="display: none;"></iframe>
        </div>

        <!-- Контент -->
        <div class="content-body">

            <!-- Постер и название -->
            <div class="hero-card">
                <img id="anime-poster" class="poster-img" src="https://static.yani.tv/img/no-photo.jpg" alt="Poster">
                <div class="hero-info">
                    <div id="anime-title" class="anime-title">Загрузка...</div>
                    <div class="badges-row">
                        <div id="badge-status" class="badge badge-status">Загрузка</div>
                        <div id="badge-episodes" class="badge">Серий: --</div>
                    </div>
                </div>
            </div>

            <!-- 1. Выбор Озвучки -->
            <div>
                <div class="section-header">
                    <div class="section-title">🎙 Озвучка</div>
                </div>
                <div id="dubbing-container" class="pills-scroll-container"></div>
            </div>

            <!-- 2. Выбор Плеера -->
            <div>
                <div class="section-header">
                    <div class="section-title">📺 Плеер</div>
                </div>
                <div id="player-container" class="pills-scroll-container"></div>
            </div>

            <!-- 3. Выбор Серии -->
            <div>
                <div class="section-header">
                    <div class="section-title">▶️ Серии</div>
                    <input type="number" id="ep-search" class="ep-search-input" placeholder="№..." oninput="filterEpisodes()">
                </div>
                <div id="episodes-container" class="episodes-grid"></div>
            </div>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('anime_id') || '12094';

        let videos = [];
        let dataStore = {};
        let currentDubbing = '';
        let currentPlayer = '';

        async function fetchWithCorsFallback(apiUrl) {
            try {
                const resp = await fetch(apiUrl);
                if (resp.ok) return await resp.json();
            } catch (e) {}

            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
            const proxyResp = await fetch(proxyUrl);
            const proxyJson = await proxyResp.json();
            return JSON.parse(proxyJson.contents);
        }

        async function initApp() {
            try {
                const apiUrl = `https://old.yummyani.me/api/anime/${animeId}?need_videos=true`;
                const json = await fetchWithCorsFallback(apiUrl);
                const respObj = json.response || {};

                document.getElementById('anime-title').innerText = respObj.title || 'Аниме';
                
                let statusText = 'Онгоинг';
                if (typeof respObj.status === 'string') {
                    statusText = respObj.status;
                } else if (respObj.anime_status && respObj.anime_status.title) {
                    statusText = respObj.anime_status.title;
                }
                document.getElementById('badge-status').innerText = statusText;
                
                const count = respObj.episodes?.count || '?';
                const aired = respObj.episodes?.aired || 0;
                document.getElementById('badge-episodes').innerText = `Серий: ${aired} / ${count}`;

                if (respObj.poster && respObj.poster.fullsize) {
                    let poster = respObj.poster.fullsize;
                    if (poster.startsWith('//')) poster = 'https:' + poster;
                    document.getElementById('anime-poster').src = poster;
                }

                videos = respObj.videos || [];
                if (!videos.length) {
                    document.getElementById('loader').innerHTML = '❌ Серии не найдены';
                    return;
                }

                dataStore = {};
                videos.forEach(v => {
                    const dub = v.data?.dubbing || 'Озвучка';
                    const player = v.data?.player || 'Плеер';

                    if (!dataStore[dub]) dataStore[dub] = {};
                    if (!dataStore[dub][player]) dataStore[dub][player] = [];
                    
                    dataStore[dub][player].push(v);
                });

                Object.keys(dataStore).forEach(dub => {
                    Object.keys(dataStore[dub]).forEach(player => {
                        dataStore[dub][player].sort((a, b) => parseInt(a.number || 0) - parseInt(b.number || 0));
                    });
                });

                renderDubbings();
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = '❌ Ошибка загрузки видео';
            }
        }

        function renderDubbings() {
            const container = document.getElementById('dubbing-container');
            container.innerHTML = '';

            const dubbings = Object.keys(dataStore);
            if (!dubbings.length) return;

            currentDubbing = dubbings[0];

            dubbings.forEach(dub => {
                const btn = document.createElement('div');
                btn.className = `pill-btn ${dub === currentDubbing ? 'active' : ''}`;
                btn.innerText = dub;
                btn.onclick = () => {
                    currentDubbing = dub;
                    document.querySelectorAll('#dubbing-container .pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPlayers();
                };
                container.appendChild(btn);
            });

            renderPlayers();
        }

        function renderPlayers() {
            const container = document.getElementById('player-container');
            container.innerHTML = '';

            const playersMap = dataStore[currentDubbing] || {};
            const players = Object.keys(playersMap);
            if (!players.length) return;

            currentPlayer = players[0];

            players.forEach(player => {
                const btn = document.createElement('div');
                btn.className = `pill-btn player-pill ${player === currentPlayer ? 'active' : ''}`;
                btn.innerText = player;
                btn.onclick = () => {
                    currentPlayer = player;
                    document.querySelectorAll('#player-container .pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderEpisodes();
                };
                container.appendChild(btn);
            });

            renderEpisodes();
        }

        function renderEpisodes() {
            const container = document.getElementById('episodes-container');
            container.innerHTML = '';

            const epList = (dataStore[currentDubbing] && dataStore[currentDubbing][currentPlayer]) || [];
            if (!epList.length) return;

            epList.forEach((v, idx) => {
                const card = document.createElement('div');
                card.className = `ep-card ${idx === 0 ? 'active' : ''}`;
                card.innerText = v.number;
                card.dataset.ep = v.number;
                card.onclick = () => {
                    document.querySelectorAll('.ep-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    setIframeUrl(v.iframe_url);
                };
                container.appendChild(card);
            });

            setIframeUrl(epList[0].iframe_url);
        }

        function filterEpisodes() {
            const q = document.getElementById('ep-search').value.trim();
            document.querySelectorAll('.ep-card').forEach(card => {
                if (!q || card.dataset.ep === q) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function setIframeUrl(url) {
            if (!url) return;
            let fullUrl = url.startsWith('//') ? 'https:' + url : url;
            const iframe = document.getElementById('anime-iframe');
            const loader = document.getElementById('loader');

            iframe.src = fullUrl;
            iframe.style.display = 'block';
            loader.style.display = 'none';
        }

        initApp();
    </script>
</body>
</html>
