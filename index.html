<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #17212b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
        }

        /* 16:9 Видеоплеер на всю ширину окна Telegram Desktop */
        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            flex-shrink: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Контент под видео */
        .content {
            padding: 14px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: #64b5f6;
            margin-bottom: 2px;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #7f91a4;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Табы озвучек */
        .dubbing-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dub-btn {
            padding: 8px 14px;
            background: #242f3d;
            color: #fff;
            border: 1px solid #2b394a;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dub-btn.active {
            background: #2b5278;
            border-color: #64b5f6;
            color: #64b5f6;
            font-weight: 600;
        }

        /* Сетка серий */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
            gap: 8px;
        }

        .ep-btn {
            padding: 10px 0;
            background: #242f3d;
            color: #fff;
            border: 1px solid #2b394a;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ep-btn.active {
            background: #64b5f6;
            border-color: #64b5f6;
            color: #17212b;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 15px;
            color: #7f91a4;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div id="loader" class="loading">⏳ Загрузка плеера...</div>
        <iframe id="anime-iframe" src="" allow="fullscreen; autoplay" allowfullscreen style="display: none;"></iframe>
    </div>

    <div class="content">
        <div id="anime-title" class="title">Аниме</div>

        <div>
            <div class="section-label">🎙 Выберите озвучку / плеер:</div>
            <div id="dubbing-container" class="dubbing-list"></div>
        </div>

        <div>
            <div class="section-label">▶️ Выберите серию:</div>
            <div id="episodes-container" class="episodes-grid"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('anime_id') || '12094';

        let videos = [];
        let groupedByDubbing = {};
        let currentDubKey = '';
        let currentIframeUrl = '';

        async function fetchWithCorsFallback(apiUrl) {
            try {
                const resp = await fetch(apiUrl);
                if (resp.ok) return await resp.json();
            } catch (e) {}

            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
            const proxyResp = await fetch(proxyUrl);
            const proxyJson = await proxyResp.json();
            return JSON.parse(proxyJson.contents);
        }

        async function loadVideos() {
            try {
                const apiUrl = `https://old.yummyani.me/api/anime/${animeId}?need_videos=true`;
                const json = await fetchWithCorsFallback(apiUrl);
                const responseData = json.response || {};

                document.getElementById('anime-title').innerText = responseData.title || 'Аниме';
                videos = responseData.videos || [];

                if (!videos.length) {
                    document.getElementById('loader').innerText = '❌ Серии не найдены.';
                    return;
                }

                // Группировка
                groupedByDubbing = {};
                videos.forEach(v => {
                    const player = v.data?.player || 'Плеер';
                    const dub = v.data?.dubbing || 'Озвучка';
                    const key = `${dub} (${player})`;

                    if (!groupedByDubbing[key]) groupedByDubbing[key] = [];
                    groupedByDubbing[key].push(v);
                });

                Object.keys(groupedByDubbing).forEach(key => {
                    groupedByDubbing[key].sort((a, b) => parseInt(a.number || 0) - parseInt(b.number || 0));
                });

                renderDubbings();
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerText = '❌ Ошибка загрузки данных.';
            }
        }

        function renderDubbings() {
            const container = document.getElementById('dubbing-container');
            container.innerHTML = '';

            const keys = Object.keys(groupedByDubbing);
            if (!keys.length) return;

            currentDubKey = keys[0];

            keys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = `dub-btn ${key === currentDubKey ? 'active' : ''}`;
                btn.innerText = key;
                btn.onclick = () => {
                    currentDubKey = key;
                    document.querySelectorAll('.dub-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderEpisodes();
                };
                container.appendChild(btn);
            });

            renderEpisodes();
        }

        function renderEpisodes() {
            const container = document.getElementById('episodes-container');
            container.innerHTML = '';

            const epList = groupedByDubbing[currentDubKey] || [];
            if (!epList.length) return;

            currentIframeUrl = epList[0].iframe_url;

            epList.forEach((v, index) => {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = v.number;
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    setIframeUrl(v.iframe_url);
                };
                container.appendChild(btn);
            });

            setIframeUrl(currentIframeUrl);
        }

        function setIframeUrl(url) {
            if (!url) return;
            let fullUrl = url.startsWith('//') ? 'https:' + url : url;
            
            const iframe = document.getElementById('anime-iframe');
            const loader = document.getElementById('loader');

            iframe.src = fullUrl;
            iframe.style.display = 'block';
            loader.style.display = 'none';
        }

        loadVideos();
    </script>
</body>
</html>
