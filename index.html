<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Player</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c10;
            --apple-glass: rgba(255, 255, 255, 0.04);
            --apple-glass-hover: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --purple-gradient: linear-gradient(135deg, #7f00ff 0%, #e100ff 100%);
            --text-main: #f5f5f7;
            --text-sub: #86868b;
            --active-glow: 0 4px 16px rgba(0, 242, 254, 0.35);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.1) 0px, transparent 45%),
                radial-gradient(at 100% 100%, rgba(127, 0, 255, 0.1) 0px, transparent 45%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", 'Outfit', sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Главный контейнер в стиле Apple UI */
        .app-container {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 16px 16px 40px 16px;
        }

        /* Рамка видеоплеера в стиле Apple TV */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 480px;
            background: #000;
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .content-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Hero Карточка Аниме */
        .hero-card {
            display: flex;
            gap: 16px;
            background: var(--apple-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .poster-img {
            width: 70px;
            height: 98px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        .anime-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
        }

        .badge-status { 
            background: rgba(0, 242, 254, 0.1); 
            color: var(--accent-primary); 
            border-color: rgba(0, 242, 254, 0.2); 
        }

        /* Заголовки секций Apple */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Капсульные кнопки-пилюли (Apple Segmented Pills) */
        .pills-scroll-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .pill-btn {
            padding: 9px 18px;
            background: var(--apple-glass);
            border: 1px solid var(--card-border);
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .pill-btn:hover {
            background: var(--apple-glass-hover);
            color: #fff;
        }

        .pill-btn:active {
            transform: scale(0.96);
        }

        .pill-btn.active {
            background: var(--accent-gradient);
            color: #000;
            border-color: transparent;
            font-weight: 700;
            box-shadow: var(--active-glow);
        }

        .player-pill.active {
            background: var(--purple-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(225, 0, 255, 0.35);
        }

        /* Поле поиска серий */
        .ep-search-input {
            width: 100px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .ep-search-input:focus { 
            border-color: var(--accent-primary); 
        }

        /* Сетка серий в стиле iOS App Store Cards */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
            gap: 10px;
        }

        .ep-card {
            padding: 12px 0;
            background: var(--apple-glass);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .ep-card:hover {
            background: var(--apple-glass-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .ep-card:active { 
            transform: scale(0.93); 
        }

        .ep-card.active {
            background: var(--accent-gradient);
            color: #000;
            border-color: transparent;
            box-shadow: var(--active-glow);
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #0b0c10;
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 14px;
            z-index: 10;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 242, 254, 0.15);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Плеер -->
        <div class="player-wrapper">
            <div id="loader" class="loading-screen">
                <div class="spinner"></div>
                <div>Загрузка видео...</div>
            </div>
            <iframe id="anime-iframe" src="" allow="fullscreen; autoplay" allowfullscreen style="display: none;"></iframe>
        </div>

        <!-- Контент -->
        <div class="content-body">

            <!-- Постер и название -->
            <div class="hero-card">
                <img id="anime-poster" class="poster-img" src="https://static.yani.tv/img/no-photo.jpg" alt="Poster">
                <div class="hero-info">
                    <div id="anime-title" class="anime-title">Загрузка...</div>
                    <div class="badges-row">
                        <div id="badge-status" class="badge badge-status">Загрузка</div>
                        <div id="badge-episodes" class="badge">Серий: --</div>
                    </div>
                </div>
            </div>

            <!-- 1. Выбор Озвучки -->
            <div>
                <div class="section-header">
                    <div class="section-title">🎙 Озвучка</div>
                </div>
                <div id="dubbing-container" class="pills-scroll-container"></div>
            </div>

            <!-- 2. Выбор Плеера -->
            <div>
                <div class="section-header">
                    <div class="section-title">📺 Плеер</div>
                </div>
                <div id="player-container" class="pills-scroll-container"></div>
            </div>

            <!-- 3. Выбор Серии -->
            <div>
                <div class="section-header">
                    <div class="section-title">▶️ Серии</div>
                    <input type="number" id="ep-search" class="ep-search-input" placeholder="№..." oninput="filterEpisodes()">
                </div>
                <div id="episodes-container" class="episodes-grid"></div>
            </div>

        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('anime_id') || '12094';

        let videos = [];
        let dataStore = {};
        let currentDubbing = '';
        let currentPlayer = '';

        async function fetchWithCorsFallback(apiUrl) {
            try {
                const resp = await fetch(apiUrl);
                if (resp.ok) return await resp.json();
            } catch (e) {}

            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
            const proxyResp = await fetch(proxyUrl);
            const proxyJson = await proxyResp.json();
            return JSON.parse(proxyJson.contents);
        }

        async function initApp() {
            try {
                const apiUrl = `https://old.yummyani.me/api/anime/${animeId}?need_videos=true`;
                const json = await fetchWithCorsFallback(apiUrl);
                const respObj = json.response || {};

                document.getElementById('anime-title').innerText = respObj.title || 'Аниме';
                
                let statusText = 'Онгоинг';
                if (typeof respObj.status === 'string') {
                    statusText = respObj.status;
                } else if (respObj.anime_status && respObj.anime_status.title) {
                    statusText = respObj.anime_status.title;
                }
                document.getElementById('badge-status').innerText = statusText;
                
                const count = respObj.episodes?.count || '?';
                const aired = respObj.episodes?.aired || 0;
                document.getElementById('badge-episodes').innerText = `Серий: ${aired} / ${count}`;

                if (respObj.poster && respObj.poster.fullsize) {
                    let poster = respObj.poster.fullsize;
                    if (poster.startsWith('//')) poster = 'https:' + poster;
                    document.getElementById('anime-poster').src = poster;
                }

                videos = respObj.videos || [];
                if (!videos.length) {
                    document.getElementById('loader').innerHTML = '❌ Серии не найдены';
                    return;
                }

                dataStore = {};
                videos.forEach(v => {
                    const dub = v.data?.dubbing || 'Озвучка';
                    const player = v.data?.player || 'Плеер';

                    if (!dataStore[dub]) dataStore[dub] = {};
                    if (!dataStore[dub][player]) dataStore[dub][player] = [];
                    
                    dataStore[dub][player].push(v);
                });

                Object.keys(dataStore).forEach(dub => {
                    Object.keys(dataStore[dub]).forEach(player => {
                        dataStore[dub][player].sort((a, b) => parseInt(a.number || 0) - parseInt(b.number || 0));
                    });
                });

                renderDubbings();
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = '❌ Ошибка загрузки видео';
            }
        }

        function renderDubbings() {
            const container = document.getElementById('dubbing-container');
            container.innerHTML = '';

            const dubbings = Object.keys(dataStore);
            if (!dubbings.length) return;

            currentDubbing = dubbings[0];

            dubbings.forEach(dub => {
                const btn = document.createElement('div');
                btn.className = `pill-btn ${dub === currentDubbing ? 'active' : ''}`;
                btn.innerText = dub;
                btn.onclick = () => {
                    currentDubbing = dub;
                    document.querySelectorAll('#dubbing-container .pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPlayers();
                };
                container.appendChild(btn);
            });

            renderPlayers();
        }

        function renderPlayers() {
            const container = document.getElementById('player-container');
            container.innerHTML = '';

            const playersMap = dataStore[currentDubbing] || {};
            const players = Object.keys(playersMap);
            if (!players.length) return;

            currentPlayer = players[0];

            players.forEach(player => {
                const btn = document.createElement('div');
                btn.className = `pill-btn player-pill ${player === currentPlayer ? 'active' : ''}`;
                btn.innerText = player;
                btn.onclick = () => {
                    currentPlayer = player;
                    document.querySelectorAll('#player-container .pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderEpisodes();
                };
                container.appendChild(btn);
            });

            renderEpisodes();
        }

        function renderEpisodes() {
            const container = document.getElementById('episodes-container');
            container.innerHTML = '';

            const epList = (dataStore[currentDubbing] && dataStore[currentDubbing][currentPlayer]) || [];
            if (!epList.length) return;

            epList.forEach((v, idx) => {
                const card = document.createElement('div');
                card.className = `ep-card ${idx === 0 ? 'active' : ''}`;
                card.innerText = v.number;
                card.dataset.ep = v.number;
                card.onclick = () => {
                    document.querySelectorAll('.ep-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    setIframeUrl(v.iframe_url);
                };
                container.appendChild(card);
            });

            setIframeUrl(epList[0].iframe_url);
        }

        function filterEpisodes() {
            const q = document.getElementById('ep-search').value.trim();
            document.querySelectorAll('.ep-card').forEach(card => {
                if (!q || card.dataset.ep === q) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function setIframeUrl(url) {
            if (!url) return;
            let fullUrl = url.startsWith('//') ? 'https:' + url : url;
            const iframe = document.getElementById('anime-iframe');
            const loader = document.getElementById('loader');

            iframe.src = fullUrl;
            iframe.style.display = 'block';
            loader.style.display = 'none';
        }

        initApp();
    </script>
</body>
</html>
